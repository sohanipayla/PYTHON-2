<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie app</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"crossorigin="anonymous">
</script>
<meta name="viewport" content="width=device-width,
       initial-scale=1" /> 
</head>
<body class="container mt-5">
    <nav class="navbar navbar-expand-lg navbar-light 
      bg-light mb-3">
      <div class="container">
        <a class="navbar-brand" href="#">Movies</a>
        <button class="navbar-toggler" type="button" 
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup"
          aria-expanded="false" 
          aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" 
          id="navbarNavAltMarkup">
          <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{% url 'news' %}">News</a>
            <a class="nav-link" href="#">Login</a>
            <a class="nav-link" href="#">Sign Up</a>
          </div>
        </div>
      </div>
    </nav>
    <form action="">  
        <div class="mb-3" style="max-width: 400px;">  
            <label class="form-label">Search for Movie:</label>  
            <input type="text" name="searchMovie" class="form-control" />  
        </div>  
        <button type="submit" class="btn btn-primary">Search</button>  
    </form> 

    <p class="mt-3">Searching for: {{ searchTerm }}</p>  

    <div class="row row-cols-1 row-cols-md-3 g-4">  
        {% for movie in movies %}  
            <div class="col">  
                <div class="card h-100 shadow-sm">  
                    {% if movie.image %}
 
                        <img class="card-img-top" src="{{ movie.image.url }}" style="height: 350px; object-fit: cover;" alt="{{ movie.title }}" />  
                    {% endif %}
                    <div class="card-body d-flex flex-column justify-content-between">  
                        <div>
                            <h5 class="card-title fw-bold text-dark">{{ movie.title }}</h5>  
                            <p class="card-text text-muted">{{ movie.description }}</p>  
                        </div>
                        {% if movie.url %}  
                            <a href="{{ movie.url }}" class="btn btn-primary w-100 mt-3"> Movie Link </a>  
                        {% endif %}  
                    </div>  
                </div>  
            </div> 
        {% endfor %}  
    </div>  

    <br />  
    <br />  

    <h2>Join our mailing list:</h2>  
    <form action="{% url 'signup' %}" method="GET">  
        <div class="mb-3" style="max-width: 400px;">  
            <label for="email" class="form-label">Enter your email:</label>  
            <input type="email" class="form-control" name="email" required />  
        </div>  
        <button type="submit" class="btn btn-primary">Sign Up</button>  
    </form>

</body>
</html>
