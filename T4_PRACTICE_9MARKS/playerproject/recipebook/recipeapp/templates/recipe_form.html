<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ action }} Recipe - Recipe Book</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-600 shadow-md">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <span class="text-2xl font-black tracking-widest text-white">RECIPEBOOK</span>
            <div class="flex space-x-4 font-bold">
                <a href="{% url 'home' %}" class="text-white hover:bg-white/10 px-4 py-2 rounded-xl transition-all">Home</a>
                <a href="{% url 'add_recipe' %}" class="text-white bg-white/20 px-4 py-2 rounded-xl transition-all">Add Recipe</a>
                <a href="{% url 'welcome' %}" class="text-white hover:bg-white/10 px-4 py-2 rounded-xl transition-all">Welcome</a>
            </div>
        </div>
    </header>

    <!-- Input Form Card Content -->
    <main class="max-w-6xl mx-auto px-4 py-12 flex-grow flex items-center justify-center w-full">
        <div class="max-w-xl w-full bg-white rounded-3xl shadow-lg border border-slate-100 p-8 md:p-10">
            <div class="border-b-2 border-slate-100 pb-4 mb-6">
                <h2 class="text-3xl font-black tracking-tight text-slate-900">{{ action }} Recipe</h2>
                <p class="text-sm text-slate-400 font-medium mt-1">Please enter the values into the properties fields properly.</p>
            </div>

            <form method="POST" class="space-y-5">
                {% csrf_token %}
                
                <div>
                    <label for="name" class="block text-sm font-bold text-slate-700 mb-2">Recipe Name</label>
                    <input type="text" id="name" name="name" value="{{ recipe.name|default:'' }}" required
                           placeholder="e.g. Alfredo Pasta"
                           class="w-full px-4 py-3 text-sm border-2 border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all font-medium bg-slate-50/30">
                </div>

                <div>
                    <label for="category" class="block text-sm font-bold text-slate-700 mb-2">Category</label>
                    <input type="text" id="category" name="category" value="{{ recipe.category|default:'' }}" required
                           placeholder="e.g. Italian, Fast Food"
                           class="w-full px-4 py-3 text-sm border-2 border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all font-medium bg-slate-50/30">
                </div>

                <div>
                    <label for="cooking_time" class="block text-sm font-bold text-slate-700 mb-2">Cooking Time (Minutes)</label>
                    <input type="number" id="cooking_time" name="cooking_time" value="{{ recipe.cooking_time|default:'' }}" required min="1"
                           placeholder="e.g. 30"
                           class="w-full px-4 py-3 text-sm border-2 border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all font-medium bg-slate-50/30">
                </div>

                <!-- Footer buttons alignment inside card -->
                <div class="flex items-center justify-end space-x-3 border-t border-slate-100 pt-6 mt-8">
                    <a href="{% url 'home' %}" class="px-5 py-2.5 text-sm font-bold text-slate-600 hover:bg-slate-100 rounded-xl transition-all border-2 border-slate-200 bg-white">
                        Cancel
                    </a>
                    <button type="submit" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-extrabold px-6 py-2.5 text-sm rounded-xl shadow-md transition-all cursor-pointer">
                        Save Recipe
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Professional Footer -->
    <footer class="bg-slate-900 border-t-4 border-emerald-500 py-5 text-center text-sm text-slate-400">
        &copy; 2026 Recipe Book Professional Project. All rights reserved.
    </footer>

</body>
</html>
