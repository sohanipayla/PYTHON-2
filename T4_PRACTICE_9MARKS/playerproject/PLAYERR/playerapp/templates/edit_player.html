<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        nav {
            margin-bottom: 20px;
        }
        nav a {
            text-decoration: none;
            color: #0066cc;
            font-weight: bold;
        }
        
        /* Form Card Wrapper */
        .form-container {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
            max-width: 450px; /* Restricts card width for clean presentation */
            margin-top: 20px;
        }

        .form-title {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5em;
            color: #222;
            border-bottom: 2px solid #0066cc;
            padding-bottom: 8px;
        }

        /* Form Layout Groups */
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .form-group label {
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 6px;
            color: #555;
        }

        /* Input Element Styling */
        .form-group input[type="text"],
        .form-group input[type="number"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #0066cc; /* Clean blue glow on focus */
        }

        /* Update Action Layout */
        .action-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn-update {
            background-color: #0066cc; /* Distinct blue theme for updating data */
            color: white;
        }

        .btn-update:hover {
            background-color: #004499;
        }

        .btn-cancel {
            background-color: #e0e0e0;
            color: #333;
        }

        .btn-cancel:hover {
            background-color: #d5d5d5;
        }
    </style>
</head>
<body>

<nav>
    <a href="/">Home</a> | 
    <a href="/welcome/">Welcome</a>
</nav>
<hr>

<div class="form-container">
    <h2 class="form-title">Modify Player Profile</h2>
    
    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="{{ player.name }}" required>
        </div>

        <div class="form-group">
            <label for="innings">Innings:</label>
            <input type="number" id="innings" name="innings" value="{{ player.test_innings }}" min="0" required>
        </div>

        <div class="form-group">
            <label for="runs">Runs:</label>
            <input type="number" id="runs" name="runs" value="{{ player.runs }}" min="0" required>
        </div>

        <div class="action-group">
            <a href="/" class="btn btn-cancel">Cancel</a>
            <button type="submit" class="btn btn-update">Update Profile</button>
        </div>
    </form>
</div>

</body>
</html>
